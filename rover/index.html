/* =========================================================

function shortAddress(address){

  if(!address) return "";

  return (
    address.slice(0,6) +
    "..." +
    address.slice(-4)
  );

}


function updateWalletUI(address){

  if(!address){

  "WALLET: " +
  shortAddress(walletAddress);

  connectWalletButton.textContent =
  shortAddress(walletAddress);

}


function saveWallet(address){

  localStorage.setItem(
    WALLET_STORAGE_KEY,
    address.toLowerCase()
  );

  localStorage.removeItem(
    WALLET_DISCONNECTED_KEY
  );

}


function clearWalletState(){

  localStorage.removeItem(
    WALLET_STORAGE_KEY

  localStorage.setItem(
    WALLET_DISCONNECTED_KEY,
    "1"
  );

/* =========================================================
   CONNECT WALLET
========================================================= */

async function connectWallet(){

  if(!window.ethereum){

    alert(
      "NO WEB3 WALLET DETECTED.\n\n" +
      "Please open Rover Hub inside your wallet browser."
    );

    return;

  }


  try{

    connectWalletButton.disabled =
    true;

    connectWalletButton.textContent =
    "CONNECTING...";


    const accounts =
    await window.ethereum.request({

      method:
      "eth_requestAccounts"

    });


    if(
      !accounts ||
      accounts.length === 0
    ){

      throw new Error(
        "No wallet account returned"
      );

    }


    const address =
    accounts[0].toLowerCase();


    saveWallet(address);

    updateWalletUI(address);

    await loadWalletGame();


  }catch(error){

    console.error(
      "Wallet connection failed:",
      error
    );


    if(error.code === 4001){

      alert(
        "WALLET CONNECTION CANCELLED."
      );

    }else{

      alert(
        "WALLET CONNECTION FAILED.\n\n" +
        "Please try again."
      );

    }

  }finally{

    connectWalletButton.disabled =
    false;

  }

}

      showDisconnectPopup();

    async accounts => {

        accounts.length === 0

        return;

      updateWalletUI(address);

      await loadWalletGame();

    }

}


/* =========================================================
   RESTORE WALLET
========================================================= */

async function restoreWallet(){

  const savedWallet =
  localStorage.getItem(
    WALLET_STORAGE_KEY
  );

  const disconnected =
  localStorage.getItem(
    WALLET_DISCONNECTED_KEY
  ) === "1";


  if(disconnected){

    updateWalletUI(null);

    return;

  }


  if(!window.ethereum){

    if(savedWallet){

      updateWalletUI(savedWallet);

      await loadWalletGame();

    }

    return;

  }


  try{

    const accounts =
    await window.ethereum.request({

      method:
      "eth_accounts"

    });


    if(
      accounts &&
      accounts.length > 0
    ){

      const address =
      accounts[0].toLowerCase();

      saveWallet(address);

      updateWalletUI(address);

      await loadWalletGame();

      return;

    }


    /*
      If provider has no connected account,
      do not falsely show the wallet as connected.
    */

    if(savedWallet){

      localStorage.removeItem(
        WALLET_STORAGE_KEY
      );

    }

    updateWalletUI(null);

  }catch(error){

    console.error(
      "Wallet restore failed:",
      error
    );

  }

}


/* =========================================================
   SUPABASE RPC HELPERS
========================================================= */

function rpcObject(data){

  if(!data)
    return null;


  if(
    Array.isArray(data)
  ){

    return data[0] || null;

  }


  if(
    typeof data === "string"
  ){

    try{

      return JSON.parse(data);

    }catch{

      return {
        message:data
      };

    }

  }


  return data;

}


function rpcRows(data){

  if(!data)
    return [];

  if(Array.isArray(data))
    return data;

  return [data];

}

  const row =
  Array.isArray(data)
  ? data[0]

    backendTodayEarned =

/* =========================================================
   CHECKIN HISTORY / STREAK
========================================================= */

function getCheckinDates(){

  return [
    ...new Set(
      backendHistory
      .filter(item => {

        const type =
        String(
          item.reward_type || ""
        ).toLowerCase();

        return (
          type === "daily_checkin" ||
          type === "checkin"
        );

      })
      .map(item =>
        item.reward_date
      )
      .filter(Boolean)
    )
  ];

}


function calculateStreak(){

  const dates =
  getCheckinDates();


  if(!dates.length)
    return 0;


  const set =
  new Set(dates);


  let current =
  new Date();


  const today =
  todayKey();


  if(!set.has(today)){

    current.setDate(
      current.getDate() - 1
    );

  }


  let streak = 0;


  while(true){

    const date =
    current.toLocaleDateString(
      "en-CA"
    );


    if(!set.has(date))
      break;


    streak++;


    current.setDate(
      current.getDate() - 1
    );

  }


  return streak;

}

async function openQuiz(){

  if(!walletAddress){

    alert(
      "CONNECT YOUR WALLET FIRST."
    );

    return;

  }


  if(
    backendStatus.quiz_claimed
  ){

    alert(
      "TODAY'S QUIZ IS ALREADY COMPLETED."
    );

    return;

  }


  const failedDate =
  localStorage.getItem(
    "roverQuizFailed_" +
    walletAddress
  );


  if(
    failedDate === todayKey()
  ){

    alert(
      "TODAY'S QUIZ IS ALREADY FAILED.\n\n" +
      "TRY AGAIN TOMORROW."
    );

    return;

  }


  let questionIndex = 0;
  let score = 0;
  let finished = false;


  const overlay =
  document.createElement(
    "div"
  );

  overlay.className =
  "quiz-overlay";

  document.body.appendChild(
    overlay
  );


  function renderQuestion(){

    const q =
    quizQuestions[
      questionIndex
    ];


    overlay.innerHTML = `

    <div class="quiz-modal">

      <div class="quiz-top">

        <div class="quiz-title">
          ROVER QUIZ
        </div>

        <div class="quiz-progress">
          ${questionIndex + 1}
          /
          ${quizQuestions.length}
        </div>

      </div>

      <div class="quiz-question">
        ${q.question}
      </div>

      <div class="quiz-options">

        ${q.options.map(
          (option,index) => `

          <button
            class="quiz-option"
            data-answer="${index}"
            type="button">

            ${String.fromCharCode(65 + index)}.
            ${option}

          </button>

        `
        ).join("")}

      </div>

      <div class="quiz-warning">
        ONE WRONG ANSWER =
        TODAY'S QUIZ FAILED.
      </div>

    </div>

    `;


    overlay
    .querySelectorAll(
      ".quiz-option"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        async () => {

          const answer =
          Number(
            button.dataset.answer
          );


          if(
            answer !== q.answer
          ){

            finishQuiz(false);

            return;

          }


          score++;

          questionIndex++;


          if(
            questionIndex >=
            quizQuestions.length
          ){

            await finishQuiz(true);

            return;

          }


          renderQuestion();

        }
      );

    });

  }


  async function finishQuiz(
    passed
  ){

    if(finished)
      return;


    finished = true;


    if(!passed){

      localStorage.setItem(
        "roverQuizFailed_" +
        walletAddress,
        todayKey()
      );


      overlay.innerHTML = `

      <div class="quiz-modal">

        <div class="quiz-result">

          <div class="quiz-result-icon">
            ❌
          </div>

          <div class="quiz-result-title">
            QUIZ FAILED
          </div>

          <div class="quiz-result-score">
            ${score} / 5 CORRECT
          </div>

          <div class="quiz-result-reward">
            0 ROVER
          </div>

          <p>
            One wrong answer ends today's quiz.
            Try again tomorrow.
          </p>

          <button
            class="btn secondary quiz-close"
            id="closeQuiz"
            type="button">

            CLOSE

          </button>

        </div>

      </div>

      `;


      quizStatusLoad();


      document
      .getElementById("closeQuiz")
      .addEventListener(
        "click",
        () => overlay.remove()
      );


      return;

    }


    /*
      IMPORTANT:
      Rover is claimed from Supabase.
      Nothing is added locally.
    */

    const result =
    await claimRoverReward(
      "quiz",
      2
    );


    if(!result.success){

      /*
        Network error may still mean the
        database transaction succeeded.
        Refresh before declaring failure.
      */

      await refreshBackendState();


      if(
        backendStatus.quiz_claimed
      ){

        passed = true;

      }else{

        finished = false;

        alert(
          "QUIZ REWARD COULD NOT BE CONFIRMED.\n\n" +
          "Please try again."
        );

        overlay.remove();

        return;

      }

    }


    localStorage.removeItem(
      "roverQuizFailed_" +
      walletAddress
    );


    overlay.innerHTML = `

    <div class="quiz-modal">

      <div class="quiz-result">

        <div class="quiz-result-icon">
          🎉
        </div>

        <div class="quiz-result-title">
          QUIZ COMPLETE
        </div>

        <div class="quiz-result-score">
          5 / 5 CORRECT
        </div>

        <div class="quiz-result-reward">
          +2 ROVER
        </div>

        <button
          class="btn quiz-close"
          id="closeQuiz"
          type="button">

          DONE

        </button>

      </div>

    </div>

    `;


    await refreshBackendState();


    document
    .getElementById("closeQuiz")
    .addEventListener(
      "click",
      () => overlay.remove()
    );

  }


  renderQuestion();

}

const wheelSectorCenters = {

  "+2 ROVER":60,

  "+4 ROVER":120,

  "+5 ROVER":180,

  "+6 ROVER":240,

  "MYSTERY REWARD":300

};


/* =========================================================
   WEIGHTED RANDOM
========================================================= */

function randomSpinReward(){

  const total =
  spinRewards.reduce(
    (sum,item) =>
    sum + item.weight,
    0
  );


  let random =
  Math.random() *
  total;


  for(
    const reward of spinRewards
  ){

    random -=
    reward.weight;


    if(random <= 0){

      return reward;

    }

  }


  return spinRewards[0];

}

/* =========================================================
   NORMALIZE ROTATION
========================================================= */

function normalizeDegrees(value){

  return (
    (
      value % 360
    ) + 360
  ) % 360;

}


/* =========================================================
   SPIN BUTTON
========================================================= */

spinButton.addEventListener(
  "click",
  async () => {

    if(spinning)
      return;


    if(!walletAddress){

      alert(
        "CONNECT YOUR WALLET FIRST."
      );

      return;

    }


    const used =
    getSpinCount();


    if(used >= 3){

      alert(
        "YOU HAVE USED ALL 3 SPINS TODAY.\n\n" +
        "COME BACK TOMORROW."
      );

      updateSpinUI();

      return;

    }


    spinning = true;

    spinButton.disabled =
    true;

    spinButton.textContent =
    "SPINNING...";


    const reward =
    randomSpinReward();


    const targetAngle =
    wheelSectorCenters[
      reward.name
    ];


    const current =
    normalizeDegrees(rotation);


    let delta =
    normalizeDegrees(
      -targetAngle -
      current
    );


    const fullSpins =
    5 +
    Math.floor(
      Math.random() * 3
    );


    delta +=
    fullSpins * 360;


    rotation +=
    delta;


    wheel.style.transform =
    `rotate(${rotation}deg)`;


    setTimeout(
      async () => {

        /*
          Every spin is recorded in Supabase.
          This lets get_rover_history count
          the daily 3-spin limit.
        */

        const rewardAmount =
        reward.type === "rover"
        ? reward.value
        : 0;


        const result =
        await claimRoverReward(
          "spin",
          rewardAmount
        );


        if(!result.success){

          await refreshBackendState();


          /*
            If the history shows that the spin
            actually reached Supabase, accept it.
          */

          const afterCount =
          getSpinCount();


          if(
            afterCount <= used
          ){

            spinning = false;

            spinButton.disabled =
            false;

            spinButton.textContent =
            "SPIN NOW";


            alert(
              "SPIN COULD NOT BE CONFIRMED.\n\n" +
              "Please try again."
            );

            return;

          }

        }


        showSpinReward(
          reward
        );


        /*
          Mystery key is recorded separately.
          It does not increase Rover balance.
        */

        if(
          reward.type === "mystery"
        ){

          const keyResult =
          await claimRoverReward(
            "mystery_key",
            0
          );


          if(!keyResult.success){

            console.error(
              "Mystery key recording failed:",
              keyResult.error
            );

          }

        }


        await refreshBackendState();


        spinning = false;

      },
      4700
    );

  }
);

/* =========================================================
   ACHIEVEMENTS
========================================================= */

function unlockAchievement(
  element,
  textElement,
  current,
  target
){

  const text =
  document.getElementById(
    textElement
  );

  const elementBox =
  document.getElementById(
    element
  );


  text.textContent =
  current +
  " / " +
  target;


  if(
    current >= target
  ){

    elementBox.classList.remove(
      "locked"
    );

    elementBox.classList.add(
      "unlocked"
    );

    text.textContent =
    "✓ UNLOCKED";

  }else{

    elementBox.classList.remove(
      "unlocked"
    );

    elementBox.classList.add(
      "locked"
    );

  }

}


function updateAchievements(){

  const streak =
  calculateStreak();


  const spins =
  getTotalSpinCount();


  const mystery =
  getMysteryOpenedCount();


  const checkin =
  getCheckinDates().length > 0;


  unlockAchievement(
    "achievementFirst",
    "achievementFirstText",
    checkin ? 1 : 0,
    1
  );


  unlockAchievement(
    "achievementStreak",
    "achievementStreakText",
    Math.min(
      streak,
      7
    ),
    7
  );


  unlockAchievement(
    "achievementSpinner",
    "achievementSpinnerText",
    Math.min(
      spins,
      30
    ),
    30
  );


  unlockAchievement(
    "achievementMystery",
    "achievementMysteryText",
    Math.min(
      mystery,
      5
    ),
    5
  );


  streakNumber.textContent =
  streak;

}

/* =========================================================
   SCROLL ANIMATION
========================================================= */

const observer =
new IntersectionObserver(
  entries => {

    entries.forEach(
      (entry,index) => {

        if(entry.isIntersecting){

          setTimeout(
            () => {

              entry.target.classList.add(
                "visible"
              );

            },
            index * 70
          );


          observer.unobserve(
            entry.target
          );

        }

      }
    );

  },
  {
    threshold:.08
  }
);


document
.querySelectorAll(".reveal")
.forEach(
  el =>
  observer.observe(el)
);
